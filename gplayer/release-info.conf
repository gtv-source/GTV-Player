# G-Player release details: the one place to edit them.
#  - THIRD-PARTY-NOTICES.txt (gplayer/collect-runtime.sh)
#  - Version info of GPlayer-Launcher.exe / GPlayer-Img.exe (version.rc;
#    meson regenerates it when this file changes, and collect-runtime.sh
#    rebuilds the exes before copying them)
# Syntax: KEY="value", one per line, no spaces around =, no " inside values.

# company named as the one that modified QEMU and offers the source
COMPANY="GTV Studio"

# where the complete source (gplayer/make-source-release.sh output) is published
SOURCE_URL=""

# address for written source requests (GPL-2.0 section 3b, valid >= 3 years)
CONTACT_EMAIL="hotro@gtv.vn"

# ---- exe version info (Properties > Details) ----
# x.y.z or x.y.z.w
VERSION="1.0.5"
PRODUCT="GPlayer"
# shared by GPlayer-Launcher.exe and GPlayer-Img.exe (QEMU links one
# version resource into every exe)
DESCRIPTION="GPlayer Launcher"
# QEMU is GPL-2.0: say so rather than "All rights reserved"
COPYRIGHT="© 2026 GTV Studio. Based on QEMU, GPL-2.0."
